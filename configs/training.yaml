seed: 42
device: "cuda"  # fallback to "cpu" handled dynamically in code

classical:
  random_forest:
    n_estimators: 150
    max_depth: 25
    min_samples_split: 4
    min_samples_leaf: 2
    n_jobs: -1
    random_state: 42
  gradient_boosting:
    n_estimators: 120
    learning_rate: 0.1
    max_depth: 5
    subsample: 0.8
    random_state: 42
  svm:
    C: 5.0
    kernel: "rbf"
    gamma: "scale"
    probability: true
    random_state: 42

deep_learning:
  model_type: "cnn1d"
  in_channels: 6
  sequence_length: 300
  num_classes: 18
  conv_channels: [64, 128, 256]
  kernel_sizes: [7, 5, 3]
  dropout: 0.3
  fc_hidden: 128
  
  # Training hyperparameters
  batch_size: 128
  epochs: 12
  learning_rate: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 4
  lr_patience: 2
  lr_factor: 0.5
  min_lr: 0.000001
  use_class_weights: true

persistence:
  artifacts_dir: "artifacts"
  models_dir: "artifacts/models"
  preprocessors_dir: "artifacts/preprocessors"
  calibration_dir: "artifacts/calibration"
  manifests_dir: "artifacts/manifests"
